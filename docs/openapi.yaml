openapi: 3.0.3
info:
  title: ERP mise à disposition de personnel – API
  version: "3.0"
  description: |
    API JSON de l'ERP (proformas, factures mensuelles, paiements) utilisée par l'interface web.
    Toutes les données sont fictives dans les exemples.

    **Multi-entreprises.** Chaque entreprise a sa propre base. À la connexion, on donne le code
    entreprise ; le cookie de session `ano_session` vaut ensuite `<code>.<jeton>` et désigne à la
    fois l'entreprise et l'utilisateur. Aucune route ne permet de lire les données d'une autre entreprise.

    **Sécurité.**
    - Cookie `HttpOnly; SameSite=Strict; Secure` (en ligne), 10 h maximum, fermé après inactivité.
    - Toute écriture (POST/PUT) d'un utilisateur connecté exige l'en-tête `X-CSRF-Token`
      (valeur `csrf` renvoyée par `GET /api/moi`) et un en-tête `Origin` du même site.
    - Rôles : `admin` (Direction), `gestion`, `lecture`. Le rôle est vérifié côté serveur sur chaque route.
    - 5 mots de passe faux → compte bloqué 15 min (423) ; trop d'essais depuis une même IP → 429.
    - Un compte qui doit changer son mot de passe ne peut appeler que `/api/moi`,
      `/api/moi/mot-de-passe` et `/api/deconnexion` (403 sinon).
    - Erreurs : `{"erreur": "message en français", "code": "CODE_OPTIONNEL"}`.
    - Montants en entiers XAF ; dates `AAAA-MM-JJ` ; mois `AAAA-MM`.
servers:
  - url: https://2-29-210-17.sslip.io
    description: Serveur d'essai (entreprises fictives)
  - url: http://localhost:8765
    description: Installation sur un poste
tags:
  - name: Session
  - name: Paramètres
  - name: Clients
  - name: Intérimaires
  - name: Dossiers
    description: Une DA = un dossier = une proforma (1 à N agents)
  - name: Factures
  - name: Documents
    description: Copie figée de chaque facture émise (Word, et PDF si LibreOffice est installé) et pièces reçues du client (DA, BC, PV). Fichiers jamais servis en accès direct, rangés hors du programme, droits 600.
  - name: Tableau de bord
  - name: Administration
  - name: Supervision
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ano_session
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  responses:
    Erreur400: {description: Données invalides, content: {application/json: {schema: {$ref: '#/components/schemas/Erreur'}}}}
    Erreur401: {description: Non connecté ou session expirée, content: {application/json: {schema: {$ref: '#/components/schemas/Erreur'}}}}
    Erreur403: {description: "Rôle insuffisant, jeton CSRF ou origine invalide, ou mot de passe à changer", content: {application/json: {schema: {$ref: '#/components/schemas/Erreur'}}}}
    Erreur404: {description: Introuvable, content: {application/json: {schema: {$ref: '#/components/schemas/Erreur'}}}}
    Erreur409: {description: "Conflit avec une règle métier (facture émise, BC manquant…)", content: {application/json: {schema: {$ref: '#/components/schemas/Erreur'}}}}
    Erreur413: {description: "Fichier trop lourd (8 Mo au plus)", content: {application/json: {schema: {$ref: '#/components/schemas/Erreur'}}}}
    Ok: {description: OK, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean, example: true}}}}}}
  schemas:
    Erreur:
      type: object
      properties:
        erreur: {type: string, example: "Identifiant ou mot de passe incorrect."}
        code: {type: string, example: ECART_BC}
    Role: {type: string, enum: [admin, gestion, lecture]}
    Statut: {type: string, enum: [Brouillon, Envoyé, Validé, BC reçu, En cours, Terminé, Annulé]}
    Utilisateur:
      type: object
      properties:
        id: {type: integer}
        identifiant: {type: string, example: direction}
        nom: {type: string, example: Direction}
        role: {$ref: '#/components/schemas/Role'}
        actif: {type: boolean}
        doit_changer_mdp: {type: boolean}
        dernier_login: {type: string, nullable: true}
    Client:
      type: object
      required: [nom]
      properties:
        id: {type: integer, readOnly: true}
        code: {type: string, readOnly: true, example: CLI001}
        nom: {type: string, maxLength: 120, example: Société Minière Exemple SA}
        adresse: {type: string}
        ville: {type: string, example: Libreville}
        telephone: {type: string}
        email: {type: string}
        contact: {type: string}
        actif: {type: boolean}
    Interimaire:
      type: object
      required: [nom]
      properties:
        id: {type: integer, readOnly: true}
        matricule: {type: string, readOnly: true, example: INT-0001}
        nom: {type: string, example: DUPONT Marie}
        poste: {type: string, description: Ancien contrat (reprise), example: Comptable}
        lieu: {type: string}
        hist_debut: {type: string, format: date}
        hist_fin: {type: string, format: date}
        derniere_visite: {type: string, format: date, description: Dernière visite médicale connue}
        notes: {type: string}
    AgentSaisie:
      type: object
      required: [nom, poste, salaire_base]
      properties:
        nom: {type: string, example: DUPONT Marie}
        poste: {type: string, example: Comptable fournisseurs}
        salaire_base: {type: integer, minimum: 1, example: 500000, description: "XAF / mois. Donnée personnelle : jamais journalisée."}
        derniere_visite: {type: string, format: date, nullable: true}
    DossierSaisie:
      type: object
      required: [client_id, date_proforma, date_debut, date_fin, nom_numero, agents]
      properties:
        client_id: {type: integer}
        num_da: {type: string, description: "Vide = n° automatique DA-AAAA-NNN (interne, jamais imprimé)"}
        nom_numero: {type: string, description: Nom repris dans le n° de proforma, example: DUPONT}
        date_proforma: {type: string, format: date}
        service: {type: string, example: DAF}
        imputation: {type: string, description: Imprimée sur la proforma seulement si renseignée}
        lieu: {type: string, example: Moanda}
        date_debut: {type: string, format: date}
        date_fin: {type: string, format: date}
        visite_mode: {type: string, enum: [Auto, Non], default: Auto}
        facture_groupee: {type: boolean, default: false, description: "Une seule facture par mois pour tout le groupe (ex. 9 infirmiers)"}
        notes: {type: string}
        agents: {type: array, minItems: 1, items: {$ref: '#/components/schemas/AgentSaisie'}}
    LigneMois:
      type: object
      properties:
        mois: {type: string, example: 2026-11}
        jours: {type: integer, example: 29}
        libelle: {type: string, example: Novembre 2026}
        jours_mois: {type: integer, example: 30}
        prorata: {type: number}
        complet: {type: boolean}
        montant: {type: number}
    Proforma:
      type: object
      description: "Coût mensuel = salaire de base × (1 + somme des charges) ; prorata = jours couverts ÷ jours du mois ; cumul HT arrondi une seule fois ; pas de TVA sur la proforma."
      properties:
        nb_agents: {type: integer}
        coefficient_pdm: {type: integer, description: "1 + charges, pour 10 000 (19100 = × 1,91)"}
        total_base: {type: integer}
        cout_mensuel_total: {type: number}
        mois: {type: array, items: {$ref: '#/components/schemas/LigneMois'}}
        nb_visites: {type: integer}
        visites_ht: {type: integer}
        cumul_ht: {type: integer, example: 6648214}
        tva: {type: integer, description: "Calculée pour information, non imprimée sur la proforma"}
        cumul_ttc: {type: integer}
    DossierDetail:
      type: object
      properties:
        dossier: {$ref: '#/components/schemas/Dossier'}
        agents: {type: array, items: {$ref: '#/components/schemas/AgentSaisie'}}
        client: {$ref: '#/components/schemas/Client'}
        proforma: {$ref: '#/components/schemas/Proforma'}
        factures: {type: array, items: {$ref: '#/components/schemas/Facture'}}
        verrouille: {type: boolean, description: Vrai dès qu'une facture est émise}
    Dossier:
      allOf:
        - $ref: '#/components/schemas/DossierSaisie'
        - type: object
          properties:
            id: {type: integer}
            numero_proforma: {type: string}
            statut: {$ref: '#/components/schemas/Statut'}
            bc_numero: {type: string, example: "493930"}
            bc_montant: {type: integer, nullable: true}
            bc_date: {type: string, format: date, nullable: true}
    Document:
      type: object
      description: Document gardé sur le serveur. Le nom du fichier sur le disque et son empreinte restent internes.
      properties:
        id: {type: integer}
        dossier_id: {type: integer}
        facture_id: {type: integer, nullable: true}
        facture_numero: {type: string, nullable: true, example: FA 162/11-MAD/2026}
        categorie: {type: string, enum: [Facture, DA, BC, PV, Autre]}
        nom: {type: string, example: BC 100001.pdf}
        type_mime: {type: string, example: application/pdf}
        taille: {type: integer, description: octets}
        ajoute_par: {type: integer, nullable: true}
        ajoute_par_nom: {type: string, nullable: true}
        ajoute_le: {type: string, example: "2026-11-30 10:12:00"}
        retire_le: {type: string, nullable: true}
    Facture:
      type: object
      properties:
        id: {type: integer}
        type: {type: string, enum: [MAD, VISITE, BIS], description: "BIS = facture ajustée selon le PV du client"}
        mois: {type: string, example: 2026-11}
        agent: {type: string}
        jours: {type: integer, nullable: true}
        jours_mois: {type: integer, nullable: true}
        montant_ht: {type: integer}
        tva: {type: integer, description: "18 % ; 0 pour la visite médicale (paramètre tva_visite)"}
        ttc: {type: integer}
        numero: {type: string, nullable: true, example: FA 001/11-MAD/2026, description: Null tant que non émise}
        date_facture: {type: string, format: date, nullable: true}
        echeance: {type: string, format: date, nullable: true}
        envoyee_le: {type: string, format: date, nullable: true}
        paye_le: {type: string, format: date, nullable: true}
        montant_paye: {type: integer, nullable: true}
        ref_paiement: {type: string}
        remplacee_par_id: {type: integer, nullable: true}
        unite: {type: string, description: "Vide = unité par défaut (Jours, 1, Forfait ; Mois pour une facture groupée)"}
        groupe: {type: integer, enum: [0, 1], description: "1 = facture groupée : agent = noms du groupe, nb_agents"}
        modifiee_le: {type: string, nullable: true, description: Corrigée à la main le}
        statut: {type: string, enum: [À émettre, À envoyer, Envoyée, En retard, Payée, Remplacée]}
        retard_jours: {type: integer}
        remarque: {type: string}
    Ids:
      type: object
      required: [ids]
      properties:
        ids: {type: array, items: {type: integer}, minItems: 1, maxItems: 500}
security:
  - session: []
paths:
  /api/sante:
    get:
      tags: [Supervision]
      summary: État du service (public, n'ouvre aucune base)
      security: []
      responses:
        "200": {description: OK, content: {application/json: {example: {ok: true}}}}
  /api/etat:
    get:
      tags: [Session]
      summary: Informations avant connexion (installation à faire ? plusieurs entreprises ?)
      security: []
      parameters:
        - {name: entreprise, in: query, schema: {type: string}, description: Code entreprise}
      responses:
        "200": {description: OK, content: {application/json: {example: {installation_requise: false, multi: true}}}}
  /api/installation:
    post:
      tags: [Session]
      summary: Création du premier compte Direction (installation sur un poste uniquement)
      security: []
      requestBody:
        content: {application/json: {schema: {type: object, required: [identifiant, nom, mot_de_passe], properties: {identifiant: {type: string}, nom: {type: string}, mot_de_passe: {type: string, minLength: 12}}}}}
      responses:
        "200": {$ref: '#/components/responses/Ok'}
        "400": {$ref: '#/components/responses/Erreur400'}
        "403": {description: Fermé en ligne (les comptes sont créés par l'administrateur de la plateforme)}
  /api/connexion:
    post:
      tags: [Session]
      summary: Connexion (pose le cookie de session)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [identifiant, mot_de_passe]
              properties:
                entreprise: {type: string, example: alpha, description: Obligatoire en ligne}
                identifiant: {type: string, example: direction}
                mot_de_passe: {type: string, format: password}
      responses:
        "200":
          description: "Connecté. En-tête Set-Cookie : ano_session=<code>.<jeton>"
          content: {application/json: {schema: {type: object, properties: {utilisateur: {$ref: '#/components/schemas/Utilisateur'}, csrf: {type: string}}}}}
        "401": {description: "Identifiant, mot de passe ou code entreprise incorrect (même message dans tous les cas)"}
        "423": {description: Compte bloqué 15 minutes}
        "429": {description: Trop de tentatives depuis cette adresse}
  /api/deconnexion:
    post:
      tags: [Session]
      summary: Déconnexion (supprime la session)
      security: [{session: [], csrf: []}]
      responses: {"200": {$ref: '#/components/responses/Ok'}}
  /api/moi:
    get:
      tags: [Session]
      summary: Utilisateur connecté et jeton CSRF
      responses:
        "200": {description: OK, content: {application/json: {example: {utilisateur: {id: 1, identifiant: direction, nom: Direction, role: admin, doit_changer_mdp: false}, csrf: "…"}}}}
        "401": {$ref: '#/components/responses/Erreur401'}
  /api/moi/mot-de-passe:
    post:
      tags: [Session]
      summary: Changer son mot de passe (ferme ses autres sessions)
      security: [{session: [], csrf: []}]
      requestBody:
        content: {application/json: {schema: {type: object, required: [actuel, nouveau], properties: {actuel: {type: string, format: password}, nouveau: {type: string, format: password, minLength: 12}}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "400": {$ref: '#/components/responses/Erreur400'}}
  /api/parametres:
    get:
      tags: [Paramètres]
      summary: Identité de l'entreprise, barème (charges, TVA, visite), codes de numérotation
      description: Tous les rôles.
      responses:
        "200": {description: OK, content: {application/json: {example: {parametres: {raison_sociale: Alpha Interim (fictif), devise: XAF, tva_pdm: 1800, visite_ht: 45000, code_entreprise: ALPHA, prefixe_facture: FA, code_mad: MAD, tva_visite: false, bc_chiffres: 6}, charges: [{libelle: CNSS, taux_pdm: 2010}]}}}}
    put:
      tags: [Paramètres]
      summary: Modifier les paramètres (Direction)
      security: [{session: [], csrf: []}]
      requestBody:
        content: {application/json: {schema: {type: object, properties: {parametres: {type: object, additionalProperties: true}, charges: {type: array, items: {type: object, properties: {libelle: {type: string}, taux_pdm: {type: integer, description: "pour 10 000 (1800 = 18 %)"}}}}}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "400": {$ref: '#/components/responses/Erreur400'}, "403": {$ref: '#/components/responses/Erreur403'}}
  /api/clients:
    get:
      tags: [Clients]
      summary: Liste des clients (Direction, Gestion)
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {clients: {type: array, items: {$ref: '#/components/schemas/Client'}}}}}}}}
    post:
      tags: [Clients]
      summary: Créer un client
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
      responses: {"200": {description: Créé, content: {application/json: {example: {ok: true, code: CLI002}}}}, "400": {$ref: '#/components/responses/Erreur400'}}
  /api/clients/{id}:
    put:
      tags: [Clients]
      summary: Modifier ou désactiver un client
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "404": {$ref: '#/components/responses/Erreur404'}}
  /api/interimaires:
    get:
      tags: [Intérimaires]
      summary: Intérimaires avec matricule fixe INT-NNNN (Direction, Gestion)
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {interimaires: {type: array, items: {$ref: '#/components/schemas/Interimaire'}}}}}}}}
    post:
      tags: [Intérimaires]
      summary: Ajouter un ancien intérimaire (reprise de l'historique, aucune facture)
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Interimaire'}}}}
      responses: {"200": {description: Créé, content: {application/json: {example: {id: 1, matricule: INT-0001}}}}, "409": {description: Nom déjà connu}}
  /api/interimaires/{id}:
    put:
      tags: [Intérimaires]
      summary: Modifier un intérimaire
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Interimaire'}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}}
  /api/dossiers:
    get:
      tags: [Dossiers]
      summary: Liste des dossiers (DA / proformas)
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "Recherche : agent, matricule, n° DA, n° proforma, BC, service, lieu"}
        - {name: statut, in: query, schema: {$ref: '#/components/schemas/Statut'}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {dossiers: {type: array, items: {$ref: '#/components/schemas/Dossier'}}}}}}}}
    post:
      tags: [Dossiers]
      summary: Saisir une DA et créer sa proforma (n° = dernier + 1)
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/DossierSaisie'}}}}
      responses: {"200": {description: Créé, content: {application/json: {example: {id: 1, numero_proforma: 1-11-ALPHA-DUPONT/2026, num_da: DA-2026-001}}}}, "400": {$ref: '#/components/responses/Erreur400'}}
  /api/dossiers/apercu:
    post:
      tags: [Dossiers]
      summary: Calculer la proforma sans rien enregistrer
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/DossierSaisie'}}}}
      responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Proforma'}}}}}
  /api/dossiers/{id}:
    get:
      tags: [Dossiers]
      summary: Détail d'un dossier (agents, proforma, factures)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DossierDetail'}}}}, "404": {$ref: '#/components/responses/Erreur404'}}
    put:
      tags: [Dossiers]
      summary: Modifier un dossier (agents, salaires et dates verrouillés dès qu'une facture est émise)
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/DossierSaisie'}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "409": {$ref: '#/components/responses/Erreur409'}}
  /api/dossiers/{id}/statut:
    post:
      tags: [Dossiers]
      summary: Changer le statut (Annulé refusé si des factures sont émises)
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {type: object, required: [statut], properties: {statut: {$ref: '#/components/schemas/Statut'}}}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "409": {$ref: '#/components/responses/Erreur409'}}
  /api/dossiers/{id}/bc:
    post:
      tags: [Dossiers]
      summary: Enregistrer le bon de commande (BC / PO) du client
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {type: object, required: [bc_numero, bc_montant], properties: {bc_numero: {type: string, example: "123456", description: "Nombre de chiffres = paramètre bc_chiffres"}, bc_montant: {type: integer}, bc_date: {type: string, format: date}}}}}}
      responses: {"200": {description: "OK ; ecart = montant BC − cumul proforma", content: {application/json: {example: {ok: true, ecart: -1}}}}}
  /api/dossiers/{id}/generer-factures:
    post:
      tags: [Dossiers]
      summary: Générer toutes les factures du dossier (une par agent et par mois + visites médicales)
      description: Refusé sans BC (code SANS_BC) ou si le BC diffère du cumul de plus de 1 XAF (code ECART_BC), sauf `forcer`.
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {forcer: {type: boolean, default: false}}}}}}
      responses: {"200": {description: OK, content: {application/json: {example: {ajoutees: 8, total: 8}}}}, "409": {$ref: '#/components/responses/Erreur409'}}
  /api/dossiers/{id}/documents:
    get:
      tags: [Documents]
      summary: Documents du dossier (Direction, Gestion)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object, properties: {documents: {type: array, items: {$ref: '#/components/schemas/Document'}}, conversion_pdf: {type: boolean, description: LibreOffice présent sur le serveur}}}}}}
        "403": {$ref: '#/components/responses/Erreur403'}
        "404": {$ref: '#/components/responses/Erreur404'}
  /api/dossiers/{id}/pieces:
    post:
      tags: [Documents]
      summary: Joindre une pièce reçue du client (Direction, Gestion)
      description: "PDF, PNG ou JPEG seulement (vérifié sur le contenu, pas sur le nom), 8 Mo au plus. Le contenu est envoyé en base64 (une URL data: est acceptée)."
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [categorie, nom, contenu], properties: {categorie: {type: string, enum: [DA, BC, PV, Autre]}, nom: {type: string, maxLength: 150, example: BC 100001.pdf}, contenu: {type: string, format: byte}}}}}
      responses:
        "200": {description: OK, content: {application/json: {example: {id: 12}}}}
        "400": {$ref: '#/components/responses/Erreur400'}
        "403": {$ref: '#/components/responses/Erreur403'}
        "404": {$ref: '#/components/responses/Erreur404'}
        "413": {$ref: '#/components/responses/Erreur413'}
  /api/documents/{id}:
    get:
      tags: [Documents]
      summary: Télécharger un document (Direction, Gestion)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {description: "Le fichier, en pièce jointe", content: {application/pdf: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}, application/vnd.openxmlformats-officedocument.wordprocessingml.document: {schema: {type: string, format: binary}}}}
        "403": {$ref: '#/components/responses/Erreur403'}
        "404": {$ref: '#/components/responses/Erreur404'}
  /api/documents/{id}/retirer:
    post:
      tags: [Documents]
      summary: Retirer une pièce de la liste (Direction seulement)
      description: Le fichier reste sur le serveur (trace). La copie d'une facture émise ne se retire jamais (409).
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {$ref: '#/components/responses/Ok'}
        "403": {$ref: '#/components/responses/Erreur403'}
        "404": {$ref: '#/components/responses/Erreur404'}
        "409": {$ref: '#/components/responses/Erreur409'}
  /api/factures:
    get:
      tags: [Factures]
      summary: Liste des factures (tous rôles ; jamais de salaire de base)
      parameters:
        - {name: mois, in: query, schema: {type: string, example: 2026-11}}
        - {name: statut, in: query, schema: {type: string}}
        - {name: dossier, in: query, schema: {type: integer}}
        - {name: ids, in: query, schema: {type: string, example: "1,2,3"}}
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {factures: {type: array, items: {$ref: '#/components/schemas/Facture'}}}}}}}}
  /api/factures/emettre:
    post:
      tags: [Factures]
      summary: Attribuer n° et date (un mois, avec rattrapage, ou une sélection)
      description: "N° = dernier + 1, jamais en arrière : « FA NNN/MM-MAD/AAAA »."
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {mois: {type: string, example: 2026-11}, rattrapage: {type: boolean}, ids: {type: array, items: {type: integer}}, date_facture: {type: string, format: date}}}}}}
      responses: {"200": {description: "OK ; archivees = copies Word gardées dans les documents du dossier (PDF ajoutés ensuite en tâche de fond)", content: {application/json: {example: {emises: 3, ids: [4, 5, 6], archivees: 3}}}}}
  /api/factures/envoyees:
    post:
      tags: [Factures]
      summary: Marquer des factures comme envoyées au client
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Ids'}, {type: object, properties: {date: {type: string, format: date}}}]}}}}
      responses: {"200": {description: OK, content: {application/json: {example: {modifiees: 3}}}}}
  /api/factures/paiement:
    post:
      tags: [Factures]
      summary: Enregistrer un paiement (montant particulier seulement pour une facture)
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Ids'}, {type: object, required: [date], properties: {date: {type: string, format: date}, reference: {type: string}, montant: {type: integer}}}]}}}}
      responses: {"200": {description: OK, content: {application/json: {example: {modifiees: 1}}}}}
  /api/factures/{id}/annuler-paiement:
    post:
      tags: [Factures]
      summary: Annuler un paiement saisi par erreur
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {"200": {$ref: '#/components/responses/Ok'}}
  /api/factures/{id}/bis:
    post:
      tags: [Factures]
      summary: Créer la facture « bis » au montant et à la date du PV du client
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {type: object, required: [montant_ht, date_pv], properties: {montant_ht: {type: integer}, date_pv: {type: string, format: date}}}}}}
      responses: {"200": {description: OK}, "409": {$ref: '#/components/responses/Erreur409'}}
  /api/factures/{id}/remarque:
    put:
      tags: [Factures]
      summary: Note interne sur une facture
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {remarque: {type: string, maxLength: 500}}}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}}
  /api/factures/{id}:
    put:
      tags: [Factures]
      summary: "Corriger une facture, émise ou non (n° inchangé, TVA et TTC recalculés, copie gardée)"
      description: "Refusé (409) si la facture est payée ou remplacée. Une facture prévue corrigée n'est plus recalculée."
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [montant_ht]
              properties:
                montant_ht: {type: integer, example: 1064042}
                jours: {type: integer, description: Quantité (facture du mois)}
                unite: {type: string, maxLength: 20, example: Jours}
                date_facture: {type: string, format: date}
                remarque: {type: string, maxLength: 300}
      responses:
        "200": {description: Facture corrigée, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, ttc: {type: integer}, archivee: {type: integer}}}}}}
        "409": {$ref: '#/components/responses/Erreur409'}
  /api/factures/word:
    get:
      tags: [Factures]
      summary: Factures au format Word (.docx, ou .zip si plusieurs)
      parameters: [{name: ids, in: query, required: true, schema: {type: string, example: "1,2"}}]
      responses:
        "200":
          description: Fichier
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {schema: {type: string, format: binary}}
            application/zip: {schema: {type: string, format: binary}}
  /api/factures/export.csv:
    get:
      tags: [Factures]
      summary: Export CSV pour Excel (sans salaire)
      parameters: [{name: mois, in: query, schema: {type: string}}]
      responses: {"200": {description: CSV (séparateur ;), content: {text/csv: {schema: {type: string}}}}}
  /api/tableau-de-bord:
    get:
      tags: [Tableau de bord]
      summary: Personnes en contrat, facturé, payé, en retard, alertes visites médicales
      parameters: [{name: mois, in: query, schema: {type: string, example: 2026-11}}]
      responses: {"200": {description: OK, content: {application/json: {example: {mois: 2026-11, libelle: Novembre 2026, personnes_en_contrat: 12, personnes_en_attente: 2, a_facturer_ht: 9500000, facture_ttc: 11210000, paye: 4200000, reste_a_encaisser: 7010000, factures_en_retard: 3, alertes_visite: [], a_faire: {a_emettre: 4, a_envoyer: 2, en_retard: 3, brouillons: 1, sans_bc: 0}}}}}}
  /api/logo:
    get:
      tags: [Paramètres]
      summary: Logo de l'entreprise (connecté ; image vide si aucun)
      responses: {"200": {description: PNG, content: {image/png: {schema: {type: string, format: binary}}}}}
  /api/signature:
    get:
      tags: [Paramètres]
      summary: Cachet et signature (connecté seulement, jamais public)
      responses: {"200": {description: PNG, content: {image/png: {schema: {type: string, format: binary}}}}, "401": {$ref: '#/components/responses/Erreur401'}}
  /api/images/{quoi}:
    put:
      tags: [Paramètres]
      summary: Téléverser le logo ou le cachet (Direction ; PNG ≤ 600 Ko en base64)
      security: [{session: [], csrf: []}]
      parameters: [{name: quoi, in: path, required: true, schema: {type: string, enum: [logo, signature]}}]
      requestBody: {content: {application/json: {schema: {type: object, required: [png], properties: {png: {type: string, format: byte}}}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "400": {$ref: '#/components/responses/Erreur400'}}
  /api/utilisateurs:
    get:
      tags: [Administration]
      summary: Comptes de l'entreprise (Direction)
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {utilisateurs: {type: array, items: {$ref: '#/components/schemas/Utilisateur'}}}}}}}}
    post:
      tags: [Administration]
      summary: Créer un compte (mot de passe provisoire à changer à la 1re connexion)
      security: [{session: [], csrf: []}]
      requestBody: {content: {application/json: {schema: {type: object, required: [identifiant, nom, role, mot_de_passe], properties: {identifiant: {type: string}, nom: {type: string}, role: {$ref: '#/components/schemas/Role'}, mot_de_passe: {type: string, format: password, minLength: 12}}}}}}
      responses: {"200": {description: Créé}, "409": {description: Identifiant déjà pris}}
  /api/utilisateurs/{id}:
    put:
      tags: [Administration]
      summary: Modifier rôle, activer/désactiver, réinitialiser le mot de passe (au moins une Direction active)
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {nom: {type: string}, role: {$ref: '#/components/schemas/Role'}, actif: {type: boolean}, mot_de_passe: {type: string, format: password}}}}}}
      responses: {"200": {$ref: '#/components/responses/Ok'}, "409": {$ref: '#/components/responses/Erreur409'}}
  /api/journal:
    get:
      tags: [Administration]
      summary: Journal des actions (qui, quoi, quand ; jamais de salaire)
      responses: {"200": {description: OK, content: {application/json: {example: {journal: [{quand: "2026-11-25T02:00:00", identifiant: direction, action: dossier_cree, objet: 1-11-ALPHA-DUPONT/2026, details: ""}]}}}}}
  /api/sauvegarde:
    post:
      tags: [Administration]
      summary: Sauvegarde immédiate de la base de l'entreprise
      security: [{session: [], csrf: []}]
      responses: {"200": {description: OK, content: {application/json: {example: {ok: true, fichier: "…/sauvegardes/erp-2026-11-25-0200.db"}}}}}
